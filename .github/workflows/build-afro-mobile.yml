name: Build AFRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AFRO-MOBILE-build-ready-source.zip'
      - '.github/workflows/build-afro-mobile.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack AFRO MOBILE source
        run: |
          test -f AFRO-MOBILE-build-ready-source.zip
          mkdir -p source
          unzip -q AFRO-MOBILE-build-ready-source.zip -d source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn
          cache-dependency-path: source/SAMP-Mobile-Launcher-RN-main/yarn.lock

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "ndk;21.4.7075529" "build-tools;31.0.0" "platforms;android-33"

      - name: Install JavaScript dependencies
        working-directory: source/SAMP-Mobile-Launcher-RN-main
        run: yarn install --frozen-lockfile

      - name: Prepare app environment
        working-directory: source/SAMP-Mobile-Launcher-RN-main
        run: cp .env.example .env

      - name: Configure Firebase Crashlytics Gradle plugin
        working-directory: source/SAMP-Mobile-Launcher-RN-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()

          plugin_classpath = "classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'"
          if "firebase-crashlytics-gradle" not in root_text:
              pattern = r"(buildscript\\s*\\{.*?dependencies\\s*\\{)"
              root_text, count = re.subn(pattern, r"\\1\\n        " + plugin_classpath, root_text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Could not safely locate android/build.gradle buildscript dependencies block")
              root.write_text(root_text)

          plugin_apply = "apply plugin: 'com.google.firebase.crashlytics'"
          if plugin_apply not in app_text and 'id "com.google.firebase.crashlytics"' not in app_text and "id 'com.google.firebase.crashlytics'" not in app_text:
              app_text = re.sub(r"(^\\s*apply plugin: ['\\\"]com\\.android\\.application['\\\"]\\s*$)", r"\\1\\n" + plugin_apply, app_text, count=1, flags=re.M)
              if plugin_apply not in app_text:
                  raise SystemExit("Could not safely add Crashlytics plugin to android/app/build.gradle")
              app.write_text(app_text)

          print("Crashlytics Gradle plugin configured.")
          PY

      - name: Build debug APK
        working-directory: source/SAMP-Mobile-Launcher-RN-main/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFRO-MOBILE-debug-APK
          path: source/SAMP-Mobile-Launcher-RN-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
